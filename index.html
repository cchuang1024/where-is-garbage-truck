<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>附近垃圾車</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen text-gray-800">

<header id="header" class="bg-teal-700 text-white px-4 pt-5 pb-4 text-center transition-colors duration-300">
  <h1 class="text-xl font-bold tracking-wide">🚛 附近垃圾車</h1>
  <p class="text-sm opacity-80 mt-1">顯示今日 200 公尺內的所有站點</p>
</header>

<main class="max-w-lg mx-auto px-4 py-4">

  <div id="status" class="text-center py-10 text-gray-500 text-base leading-relaxed">
    <div class="w-9 h-9 border-4 border-gray-200 border-t-teal-600 rounded-full animate-spin mx-auto mb-4"></div>
    定位中，請稍候…
  </div>

  <div id="toolbar" class="flex gap-2 mb-3" hidden>
    <button id="btnUpcoming" disabled
      class="flex-1 py-2.5 rounded-lg text-sm font-semibold cursor-pointer
             bg-teal-700 text-white
             disabled:bg-gray-300 disabled:text-gray-500 disabled:cursor-not-allowed">
      現在之後還有幾班？
    </button>
    <button id="btnAll"
      class="flex-1 py-2.5 rounded-lg text-sm font-semibold cursor-pointer bg-teal-700 text-white"
      hidden>
      顯示全天
    </button>
  </div>

  <p id="summary" class="text-sm text-gray-400 mb-3 px-0.5" hidden></p>

  <div id="results"></div>

</main>

<script src="data.js"></script>
<script>
'use strict';

const DAY_NAMES = ['日','一','二','三','四','五','六'];
const MAX_DIST  = 200;

let allNearby = [];

function haversine(lat1, lng1, lat2, lng2) {
  const R  = 6371000;
  const f1 = lat1 * Math.PI / 180;
  const f2 = lat2 * Math.PI / 180;
  const df = (lat2 - lat1) * Math.PI / 180;
  const dl = (lng2 - lng1) * Math.PI / 180;
  const a  = Math.sin(df/2)**2 + Math.cos(f1)*Math.cos(f2)*Math.sin(dl/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

function formatTime(hhmm) {
  const s = String(hhmm).padStart(4, '0');
  return s.slice(0, 2) + ':' + s.slice(2);
}

function nowHHMM() {
  const d = new Date();
  return d.getHours() * 100 + d.getMinutes();
}

function statusTag(stop) {
  const now    = nowHHMM();
  const nowMin = Math.floor(now / 100) * 60 + (now % 100);
  const arrMin = Math.floor(stop.arrive / 100) * 60 + (stop.arrive % 100);
  const mins   = arrMin - nowMin;
  if (mins > 0) {
    return `<span class="text-xs px-2 py-0.5 rounded-full bg-sky-100 text-sky-700 whitespace-nowrap">⏱ ${mins} 分鐘後抵達</span>`;
  }
  return `<span class="text-xs px-2 py-0.5 rounded-full bg-amber-100 text-amber-800 whitespace-nowrap">🚛 現正停靠</span>`;
}

function setStatus(msg, type = '') {
  const el = document.getElementById('status');
  el.innerHTML = msg;
  el.className = 'text-center py-10 leading-relaxed';
  if (type === 'error') {
    el.classList.add('text-red-500', 'text-base');
  } else if (type === 'rest') {
    el.classList.add('text-gray-500', 'text-lg', 'font-semibold');
  } else {
    el.classList.add('text-gray-500', 'text-base');
  }
  el.hidden = false;
}

function render(stops, showStatusTag = false) {
  const status  = document.getElementById('status');
  const summary = document.getElementById('summary');
  const results = document.getElementById('results');

  status.hidden = true;

  if (stops.length === 0) {
    setStatus('附近 200 公尺內今日無垃圾車站點。', 'error');
    summary.hidden = true;
    results.innerHTML = '';
    return;
  }

  summary.textContent = `找到 ${stops.length} 個站點`;
  summary.hidden = false;

  results.innerHTML = stops.map(s => `
    <div class="bg-white rounded-xl shadow-sm p-4 mb-2.5 grid items-start gap-x-3"
         style="grid-template-columns:64px 1fr">
      <div class="text-center pt-0.5">
        <div class="text-2xl font-bold text-teal-700 leading-none">${Math.round(s.dist)}</div>
        <div class="text-xs text-gray-400 mt-0.5">公尺</div>
      </div>
      <div>
        <div class="text-sm font-semibold leading-snug mb-2">${s.addr}</div>
        <div class="flex flex-wrap gap-1.5">
          <span class="text-xs px-2 py-0.5 rounded-full bg-gray-100 text-gray-600 whitespace-nowrap">
            🕐 ${formatTime(s.arrive)}–${formatTime(s.depart)}
          </span>
          <span class="text-xs px-2 py-0.5 rounded-full bg-teal-50 text-teal-700 whitespace-nowrap">
            ${s.route}
          </span>
          ${showStatusTag ? statusTag(s) : ''}
        </div>
      </div>
    </div>
  `).join('');
}

function onSuccess(pos) {
  const lat = pos.coords.latitude;
  const lng = pos.coords.longitude;

  allNearby = TRUCKS
    .map(t => ({ ...t, dist: haversine(lat, lng, t.lat, t.lng) }))
    .filter(t => t.dist <= MAX_DIST)
    .sort((a, b) => a.arrive - b.arrive);

  render(allNearby);

  const toolbar     = document.getElementById('toolbar');
  const btnUpcoming = document.getElementById('btnUpcoming');
  toolbar.hidden       = false;
  btnUpcoming.disabled = false;
}

function onError(err) {
  if (err.code === err.PERMISSION_DENIED) {
    setStatus('需要定位權限才能查詢附近站點。<br>請在瀏覽器設定中允許本頁面存取位置。', 'error');
  } else {
    setStatus('定位失敗，請確認裝置 GPS 已開啟後重新整理頁面。', 'error');
  }
}

function init() {
  const day    = new Date().getDay();
  const header = document.getElementById('header');

  if (day === 0 || day === 3) {
    header.classList.replace('bg-teal-700', 'bg-gray-400');
    setStatus(`今日（週${DAY_NAMES[day]}）垃圾車休息，明天見。`, 'rest');
    return;
  }

  if (!navigator.geolocation) {
    setStatus('您的瀏覽器不支援定位功能。', 'error');
    return;
  }

  navigator.geolocation.getCurrentPosition(onSuccess, onError, {
    timeout: 10000,
    maximumAge: 60000,
  });
}

document.getElementById('btnUpcoming').addEventListener('click', () => {
  const now      = nowHHMM();
  const upcoming = allNearby.filter(s => s.depart >= now);

  if (upcoming.length === 0) {
    setStatus('今日附近班次已全數離站。');
    document.getElementById('summary').hidden = true;
    document.getElementById('results').innerHTML = '';
  } else {
    render(upcoming, true);
  }

  document.getElementById('btnUpcoming').hidden = true;
  document.getElementById('btnAll').hidden = false;
});

document.getElementById('btnAll').addEventListener('click', () => {
  render(allNearby, false);
  document.getElementById('btnAll').hidden = true;
  document.getElementById('btnUpcoming').hidden = false;
});

document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
